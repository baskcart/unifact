app = "unifact-origin"
primary_region = "iad"

[build]

[env]
  PORT = "4110"
  NODE_ENV = "production"

[http_service]
  internal_port = 4110
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
